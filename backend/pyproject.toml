[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the docker-fastapi-react-template starter"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
dependencies = [
    "fastapi>=0.110,<0.116",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0.55,<2.1",
    "alembic>=1.20.1",
    "asyncpg>=0.29",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.1",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "redis>=5.0",
    "python-json-logger>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "fakeredis>=2.21",
    "ruff>=0.4",
    "mypy>=2.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = false
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["app.api.routes.*"]
disallow_untyped_decorators = false
