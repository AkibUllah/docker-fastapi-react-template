# Example deployment: build + push images to GHCR, then SSH to the host and
# `compose pull && up`. Required repository secrets:
#   DEPLOY_HOST      hostname or IP of the server
#   DEPLOY_USER      SSH user that can run docker compose
#   DEPLOY_SSH_KEY   private key for that user (ed25519 recommended)
#   DEPLOY_PATH      directory on the server containing docker-compose.prod.yml and .env
# GITHUB_TOKEN is provided automatically and is enough to push to ghcr.io.
#
# Images are always built and pushed for a release tag. The SSH deploy job only runs
# once a server exists: set the repository variable DEPLOY_ENABLED=true
# (Settings -> Secrets and variables -> Actions -> Variables) after adding the secrets.
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy
        required: true
        default: latest

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        # Registry paths must be lowercase; the owner name may not be.
        run: |
          echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - name: Pull, migrate and restart on the server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ needs.build-push.outputs.tag }}/" .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
