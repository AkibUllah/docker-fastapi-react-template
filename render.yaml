# Render blueprint: FastAPI API + nginx-served SPA + free Postgres and Key Value (Redis).
# The SPA image proxies /api to the API over Render's private network, so the browser uses one
# origin. The API runs Alembic migrations before starting and creates the first superuser from
# APP_FIRST_SUPERUSER_* (you are prompted for both at deploy time).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fastapi-react-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >-
      sh -c "alembic upgrade head
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips '*'"
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: APP_DATABASE_URL
        fromDatabase:
          name: fastapi-react-db
          property: connectionString
      - key: APP_REDIS_URL
        fromService:
          name: fastapi-react-redis
          type: keyvalue
          property: connectionString
      - key: APP_CORS_ORIGINS
        value: ""
      - key: APP_LOG_JSON
        value: "true"
      - key: APP_FIRST_SUPERUSER_EMAIL
        sync: false
      - key: APP_FIRST_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: fastapi-react-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: "80"
      - key: API_HOST
        fromService:
          name: fastapi-react-api
          type: web
          property: host
      - key: API_PORT
        fromService:
          name: fastapi-react-api
          type: web
          property: port

  - type: keyvalue
    name: fastapi-react-redis
    plan: free
    ipAllowList: []

databases:
  - name: fastapi-react-db
    plan: free
    databaseName: app
    user: app
